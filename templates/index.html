<!DOCTYPE html>
<html>

<head>
    <title>Agentic RAG System</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f35 100%);
            color: #e2e8f0;
            margin: 0;
        }

        header {
            background: #020617;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .container {
            display: flex;
            height: calc(100vh - 80px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #020617;
            padding: 20px;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        /* MAIN AREA */
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* CARD */
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #38bdf8;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        .card h3 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 18px;
        }

        .card p {
            line-height: 1.6;
            color: #e2e8f0;
            margin: 0;
        }

        .timing-info {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
        }

        /* INPUT */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            margin-bottom: 10px;
            background: #1e293b;
            color: white;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        input[type="file"] {
            margin-bottom: 10px;
        }

        /* BUTTON */
        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #38bdf8;
            color: black;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .danger {
            background: #ef4444;
            color: white;
        }

        .danger:hover {
            background: #dc2626;
        }

        /* FILE LIST */
        .file-list {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-list li {
            font-size: 13px;
            margin-bottom: 8px;
            color: #94a3b8;
            padding: 8px;
            background: #0f172a;
            border-radius: 4px;
            word-break: break-word;
        }

        h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
        }

        .query-section {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
    </style>
</head>

<body>

    <header>
        <h2>🤖 Controlled Agentic RAG System</h2>
    </header>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <div>
                <h3>📤 Upload Documents</h3>

                <form method="POST" enctype="multipart/form-data">
                    <input type="file" name="files" multiple>
                    <button type="submit">Upload</button>
                </form>
            </div>

            <div>
                <h3>📄 Documents</h3>
                <ul class="file-list">
                    {% for f in files %}
                    <li>{{ f }}</li>
                    {% endfor %}
                </ul>
            </div>

            <div>
                <a href="/clear_docs" style="text-decoration: none;">
                    <button class="danger">🗑️ Clear Documents</button>
                </a>
            </div>

        </div>

        <!-- MAIN -->
        <div class="main">

            <div class="query-section">
                <h3>❓ Ask a Question</h3>

                <form method="POST">
                    <input type="text" name="query" placeholder="Enter your question..." required>
                    <button type="submit">🔍 Search</button>
                </form>
            </div>

            {% if final_answer %}
            <div class="card">
                <h3>✨ Answer</h3>
                <p>{{ final_answer }}</p>
                {% if execution_time %}
                <div class="timing-info">
                    ⏱️ Execution Time: {{ execution_time|round(2) }} seconds
                </div>
                {% endif %}
            </div>
            {% endif %}

        </div>

    </div>

</body>

</html>
